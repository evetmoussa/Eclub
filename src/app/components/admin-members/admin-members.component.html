<header class="page-top">
  <div>
    <h1>Elite Sports Admin</h1>
    <p class="muted">Member subscriptions, retention and lifecycle.</p>
  </div>
  <button class="btn-primary">
    <span class="material-symbols-outlined">person_add</span>
    Add Member
  </button>
</header>

<!-- ===== Top KPI row ===== -->


<!-- ===== Tabs + filters ===== -->
<section class="toolbar">
  <nav class="tabs">
    <button
      *ngFor="let t of tabs"
      class="tab"
      [class.active]="activeTab() === t"
      (click)="setTab(t)">
      {{ t }}
    </button>
  </nav>

  <div class="actions">
    <div class="search">
      <span class="material-symbols-outlined">search</span>
      <input type="text"
             placeholder="Search members…"
             [ngModel]="query()"
             (ngModelChange)="setQuery($event)">
    </div>
    <button class="btn-ghost">
      <span class="material-symbols-outlined">filter_list</span>
      Filter
    </button>
    <button class="btn-ghost">
      <span class="material-symbols-outlined">sort</span>
      Sort
    </button>
  </div>
</section>

<!-- ===== Member rows ===== -->
<section class="member-table">
  <header class="row head">
    <span>Member</span>
   
    
    <span>Joined</span>
    <span>Last active</span>
    <span></span>
  </header>

  <article class="row" *ngFor="let m of paged()">
    <div class="profile">
      <img [src]="m.avatarUrl" [alt]="m.name" (error)="onImgError($event)">
      <div>
        <strong>{{ m.name }}</strong>
        <small class="muted">{{ m.email }}</small>
      </div>
    </div>

    
   
    <span class="muted">{{ m.joinedAt | date:'MMM d, y' }}</span>
    <span class="muted">{{ m.lastActive }}</span>

   
  </article>

  <article class="empty" *ngIf="!filtered().length">
    <span class="material-symbols-outlined">group_off</span>
    <p>No members match this view.</p>
  </article>
</section>

<!-- ===== Pagination ===== -->
<app-pager [page]="page()" [totalPages]="totalPages()" (pageChange)="page.set($event)"></app-pager>
